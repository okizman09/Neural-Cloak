name: Scheduled Background Tasks

on:
  schedule:
    # Runs at 00:00, 06:00, 12:00, 18:00 UTC every day
    - cron: '0 */6 * * *'
  # Allows triggering the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  run-tasks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Optional: Cache pip dependencies for speed

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled tasks
        env:
          # Securely pass necessary secrets from GitHub Settings > Secrets
          # Un-comment and update these as needed
          # DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # API_KEY: ${{ secrets.API_KEY }}
          ENV: production
        run: |
          python task.py
